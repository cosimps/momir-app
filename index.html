<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scryfall Card Fetcher</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM for functionality -->
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <!-- Babel to transpile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Custom scrollbar for a better look in the history section */
        .history-scrollbar::-webkit-scrollbar {
            height: 8px;
        }
        .history-scrollbar::-webkit-scrollbar-track {
            background: #1f2937; /* gray-800 */
            border-radius: 10px;
        }
        .history-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563; /* gray-600 */
            border-radius: 10px;
        }
        .history-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280; /* gray-500 */
        }
        /* Custom styles for radio and checkbox inputs to match Tailwind form plugins */
        .form-radio {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            border-radius: 50%;
            width: 1rem;
            height: 1rem;
            border: 2px solid #4b5563;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .form-radio:checked {
            background-color: #3b82f6; /* blue-500 */
            border-color: #3b82f6;
        }
        .form-checkbox {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 1rem;
            height: 1rem;
            border: 2px solid #4b5563;
            border-radius: 0.25rem;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .form-checkbox:checked {
            background-color: #3b82f6; /* blue-500 */
            border-color: #3b82f6;
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
        }
    </style>
</head>
<body class="bg-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useCallback, useEffect } = React;

        // --- Main App Component ---
        const App = () => {
          // --- State Management ---
          const [playerName, setPlayerName] = useState('');
          const [savedPlayers, setSavedPlayers] = useState([]);
          const [cmc, setCmc] = useState('');
          const [currentCard, setCurrentCard] = useState(null);
          const [history, setHistory] = useState({});
          const [loading, setLoading] = useState(false);
          const [error, setError] = useState('');

          // --- Settings State ---
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [rarity, setRarity] = useState(''); // '', 'common', 'uncommon', 'rare', 'mythic'
          const [cardTypes, setCardTypes] = useState({
              creature: true,
              artifact: false,
              enchantment: false,
              planeswalker: false,
          });
          const [isLegendary, setIsLegendary] = useState(false);

          // --- Load and Save State from/to LocalStorage ---
          useEffect(() => {
            try {
                const savedData = localStorage.getItem('scryfallFetcherState');
                if (savedData) {
                    const { savedPlayers, rarity, cardTypes, isLegendary, history } = JSON.parse(savedData);
                    if (savedPlayers) setSavedPlayers(savedPlayers);
                    if (rarity) setRarity(rarity);
                    if (cardTypes) setCardTypes(cardTypes);
                    if (isLegendary !== undefined) setIsLegendary(isLegendary);
                    if (history) setHistory(history);
                }
            } catch (error) {
                console.error("Failed to load state from localStorage", error);
            }
          }, []);

          useEffect(() => {
            try {
                const stateToSave = { savedPlayers, rarity, cardTypes, isLegendary, history };
                localStorage.setItem('scryfallFetcherState', JSON.stringify(stateToSave));
            } catch (error) {
                console.error("Failed to save state to localStorage", error);
            }
          }, [savedPlayers, rarity, cardTypes, isLegendary, history]);


          // --- API Call Function ---
          const fetchRandomCard = useCallback(async (cmcValue) => {
            const trimmedPlayerName = playerName.trim();
            if (!trimmedPlayerName) {
              setError('Please enter a player name before fetching.');
              return;
            }
            if (cmcValue === '' || cmcValue === null || isNaN(parseInt(cmcValue)) || parseInt(cmcValue) < 0) {
              setError('A valid, non-negative number for the CMC is required.');
              return;
            }

            const selectedTypes = Object.entries(cardTypes)
              .filter(([_, isSelected]) => isSelected)
              .map(([type, _]) => type);

            if (selectedTypes.length === 0) {
                setError('Please select at least one card type in settings.');
                return;
            }

            setLoading(true);
            setError('');

            if (!savedPlayers.includes(trimmedPlayerName)) {
                setSavedPlayers(prev => [...prev, trimmedPlayerName].sort());
            }

            let queryParts = ['-o:search', 'in:paper'];

            const typesQuery = selectedTypes.map(type => {
                if (type === 'enchantment') return 't:enchantment -t:aura';
                return `t:${type}`;
            }).join(' OR ');
            queryParts.push(`(${typesQuery})`);

            if (rarity) queryParts.push(`r:${rarity}`);
            if (isLegendary) queryParts.push('is:legendary');
            queryParts.push(`cmc=${cmcValue}`);

            const scryfallURL = `https://api.scryfall.com/cards/random?q=${encodeURIComponent(queryParts.join(' '))}`;

            try {
              let response;
              let attempts = 0;
              while (attempts < 3) {
                  response = await fetch(scryfallURL);
                  if (response.ok) break;
                  await new Promise(res => setTimeout(res, 1000 * Math.pow(2, attempts)));
                  attempts++;
              }

              if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.details || `No cards found matching your criteria for CMC ${cmcValue}.`);
              }

              const data = await response.json();

              if (data && data.image_uris && data.image_uris.large) {
                setCurrentCard(data);
                setHistory(prevHistory => {
                  const playerHistory = prevHistory[trimmedPlayerName] || [];
                  if (!playerHistory.find(card => card.id === data.id)) {
                    return { ...prevHistory, [trimmedPlayerName]: [data, ...playerHistory] };
                  }
                  return prevHistory;
                });
              } else {
                throw new Error("Found a card, but it doesn't have a valid image.");
              }
            } catch (err) {
              console.error(err);
              setError(err.message || 'An unexpected error occurred. Please try again.');
              setCurrentCard(null);
            } finally {
              setLoading(false);
            }
          }, [playerName, savedPlayers, cardTypes, rarity, isLegendary]);

          // --- History Management ---
          const handleRemoveCard = (player, cardId) => {
            setHistory(prevHistory => {
              const updatedPlayerHistory = prevHistory[player].filter(card => card.id !== cardId);
              const newHistory = { ...prevHistory };
              if (updatedPlayerHistory.length > 0) newHistory[player] = updatedPlayerHistory;
              else delete newHistory[player];
              return newHistory;
            });
          };

          const clearHistory = () => {
            if (window.confirm("Are you sure you want to clear the entire history? This cannot be undone.")) {
                setHistory({});
            }
          };

          // --- Settings Handlers ---
          const handleCardTypeChange = (event) => {
            const { name, checked } = event.target;
            setCardTypes(prev => ({ ...prev, [name]: checked }));
          };

          const cmcButtons = Array.from({ length: 21 }, (_, i) => i);

          return (
            <div className="bg-gray-900 text-white min-h-screen font-sans flex flex-col items-center p-4 sm:p-6">
              <div className="w-full max-w-5xl mx-auto flex flex-col flex-1">

                <header className="text-center mb-6">
                    <h1 className="text-4xl sm:text-5xl font-bold text-white mb-2">Momir Card Fetcher</h1>
                </header>

                {/* --- Player Name Section --- */}
                <div className="mb-4">
                  <label htmlFor="playerName" className="block text-lg font-medium text-gray-300 mb-2">Player Name</label>
                  <input id="playerName" type="text" className="w-full bg-gray-800 text-white px-4 py-3 rounded-lg border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow text-lg" placeholder="Enter player name..." value={playerName} onChange={(e) => { setPlayerName(e.target.value); if(error) setError(''); }} />
                  {savedPlayers.length > 0 && (
                    <div className="flex flex-wrap gap-2 mt-3">
                      {savedPlayers.map(p => <button key={p} onClick={() => setPlayerName(p)} className={`px-3 py-1 rounded-full text-sm transition-colors ${playerName === p ? 'bg-blue-600 text-white font-semibold' : 'bg-gray-700 hover:bg-gray-600 text-gray-300'}`}>{p}</button>)}
                    </div>
                  )}
                </div>

                {/* --- Settings Tray --- */}
                <div className="bg-gray-800 border border-gray-700 rounded-lg mb-6">
                    <button onClick={() => setIsSettingsOpen(!isSettingsOpen)} className="w-full p-3 text-left text-lg font-semibold flex justify-between items-center">
                        Search Settings
                        <svg className={`w-6 h-6 transition-transform ${isSettingsOpen ? 'transform rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    {isSettingsOpen && (
                        <div className="p-4 border-t border-gray-700 grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div>
                                <h4 className="font-semibold mb-2 text-gray-300">Rarity</h4>
                                {['Any', 'Common', 'Uncommon', 'Rare', 'Mythic'].map(r => (
                                    <label key={r} className="flex items-center space-x-2 text-gray-400 hover:text-white cursor-pointer"><input type="radio" name="rarity" value={r === 'Any' ? '' : r.toLowerCase()} checked={rarity === (r === 'Any' ? '' : r.toLowerCase())} onChange={(e) => setRarity(e.target.value)} className="form-radio"/><span>{r}</span></label>
                                ))}
                            </div>
                            <div>
                                <h4 className="font-semibold mb-2 text-gray-300">Card Types</h4>
                                {Object.keys(cardTypes).map(type => (
                                    <label key={type} className="flex items-center space-x-2 text-gray-400 hover:text-white cursor-pointer capitalize"><input type="checkbox" name={type} checked={cardTypes[type]} onChange={handleCardTypeChange} className="form-checkbox"/><span>{type} {type === 'enchantment' && '(non-Aura)'}</span></label>
                                ))}
                            </div>
                            <div>
                                <h4 className="font-semibold mb-2 text-gray-300">Other</h4>
                                <label className="flex items-center space-x-2 text-gray-400 hover:text-white cursor-pointer"><input type="checkbox" checked={isLegendary} onChange={(e) => setIsLegendary(e.target.checked)} className="form-checkbox"/><span>Legendary</span></label>
                            </div>
                        </div>
                    )}
                </div>

                {/* --- CMC Selection --- */}
                <div className="mb-6 bg-gray-800 border border-gray-700 p-4 rounded-lg">
                  <p className="text-lg font-medium text-gray-300 mb-3">Select Card CMC</p>
                  <div className="grid grid-cols-7 gap-2 mb-4">
                    {cmcButtons.map(num => <button key={num} onClick={() => fetchRandomCard(num)} disabled={loading || !playerName.trim()} className="aspect-square bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition-all duration-200 ease-in-out disabled:bg-gray-600 disabled:cursor-not-allowed shadow-lg flex items-center justify-center text-xl">{num}</button>)}
                  </div>
                  <div className="flex flex-col sm:flex-row gap-3">
                    <input type="number" className="flex-grow bg-gray-700 text-white px-4 py-3 rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow text-lg" placeholder="Or enter manually" value={cmc} onChange={(e) => setCmc(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && fetchRandomCard(cmc)} />
                    <button onClick={() => fetchRandomCard(cmc)} disabled={loading || !playerName.trim()} className="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition-all duration-200 ease-in-out disabled:bg-gray-600 disabled:cursor-not-allowed shadow-lg"> {loading ? 'Fetching...' : 'Fetch Manual CMC'}</button>
                  </div>
                </div>

                <main className="flex-1 bg-gray-800 rounded-xl p-4 sm:p-6 flex justify-center items-center mb-6 border border-gray-700 min-h-[500px] relative">
                  {loading && <div className="absolute inset-0 bg-gray-800 bg-opacity-75 flex justify-center items-center rounded-xl z-10"><div className="w-16 h-16 border-4 border-t-blue-500 border-gray-600 rounded-full animate-spin"></div></div>}
                  {error && !loading && <p className="text-red-400 text-center text-lg px-4">{error}</p>}
                  {!error && currentCard && <img src={currentCard.image_uris.large} alt={currentCard.name} className="max-w-full max-h-full object-contain rounded-lg shadow-2xl"/>}
                  {!loading && !error && !currentCard && <div className="text-center"><p className="text-gray-500 text-xl">Fetched cards will appear here</p></div>}
                </main>

                {Object.keys(history).length > 0 && (
                  <footer className="w-full">
                    <div className="flex justify-between items-center mb-4"><h2 className="text-2xl font-bold text-white">History</h2><button onClick={clearHistory} className="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">Clear All History</button></div>
                    {Object.entries(history).map(([player, cards]) => (
                      <div key={player} className="mb-6">
                          <h3 className="text-xl font-semibold text-blue-300 mb-3 border-b-2 border-gray-700 pb-1">{player}</h3>
                          <div className="flex gap-4 pb-4 overflow-x-auto history-scrollbar">
                              {cards.map(card => (
                                <div key={card.id} className="relative group flex-shrink-0">
                                    <img src={card.image_uris.small} alt={card.name} onClick={() => setCurrentCard(card)} className="w-28 h-auto rounded-md border-2 border-gray-700 cursor-pointer transition-transform duration-200 group-hover:scale-105"/>
                                    <button onClick={() => handleRemoveCard(player, card.id)} className="absolute -top-2 -right-2 w-7 h-7 bg-red-600 text-white font-black rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-200 hover:bg-red-500 focus:outline-none focus:ring-2 focus:ring-red-400">X</button>
                                </div>
                               ))}
                          </div>
                      </div>
                    ))}
                  </footer>
                )}
              </div>
            </div>
          );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
